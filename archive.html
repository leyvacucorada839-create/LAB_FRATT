<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head> 
<body>
    <nav class="navbar navbar-expand-lg bg-transparent">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home')}}">Felce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="{{ url_for('info') }}">Informazioni</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="{{ url_for('generate') }}" >Generate</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="{{ url_for('archive') }}" >Archive</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <div class="m">
        <div class="mo3">
            <div class="container mt-4">
                <h2>Archivio Frattali</h2>
                <h4>Tutte le immagini generate finora:</h4>
                <hr>

                <div class="row">
                    {% if immagini %}
                        {% for img in immagini %}
                            <div class="col-md-3 mb-4">
                                <div class="card">
                                    <!-- percorso: frattali_img/ + nome del file -->
                                    <img src="{{ url_for('static', filename='frattali_img/' + img) }}" class="card-img-top" alt="Frattale">
                                    <div class="card-body">
                                        <p class="card-text small text-muted">{{ img }}</p>
                                        <a href="{{ url_for('static', filename='frattali_img/' + img) }}" class="btn btn-sm btn-outline-primary" download>Download</a>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    {% else %}
                        <div class="col-12">
                            <div class="alert alert-info">Non ci sono immagini nell'archivio. Genera una.</div>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>    
<!--------------------------->
    <div>
        <video style="filter:brightness(65%)" autoplay loop muted playsinline class="back-video">
            <source src="{{ url_for('static', filename='images/felce.mp4') }}" type="video/mp4">
        </video>
    </div>

</body>
</html>
